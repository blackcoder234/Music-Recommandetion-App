<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Beatify - Playlist Details</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="/assets/css/custom_css.css" />
    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="/assets/css/style.css" />
  </head>

  <body
    class="bg-background text-text-main font-sans antialiased h-screen overflow-hidden flex flex-col"
  >
    <!-- App Container -->
    <div id="app" class="flex-1 flex overflow-hidden flex-col md:flex-row">
      <main
        class="flex-1 overflow-y-auto bg-background relative custom-scrollbar"
      >
        <!-- Desktop Navbar -->
        <header
          class="h-20 px-8 hidden md:flex justify-between items-center sticky top-0 bg-background/95 backdrop-blur-md z-30 border-b border-white/5"
        >
          <div class="flex-1 max-w-xl">
             <div class="relative group">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                </div>
                <input id="global-search-input" type="text" class="block w-full pl-10 pr-3 py-2.5 border border-transparent rounded-full leading-5 bg-surface text-gray-300 placeholder-gray-500 focus:outline-none focus:bg-[#252525] focus:border-primary/50" placeholder="Search..." />
             </div>
          </div>
          <div class="flex items-center gap-8 ml-8">
             <nav class="hidden sm:flex gap-6 text-sm font-medium text-text-secondary">
                 <a href="/about" class="hover:text-white">About Us</a>
                 <a href="/contact" class="hover:text-white">Contact</a>
                 <a href="/premium" class="hover:text-white">Premium</a>
             </nav>
             <div class="flex items-center gap-4">
                 <div class="auth-login-btn flex items-center gap-4"><a href="/login">Login</a><a href="/signup" class="bg-primary text-white px-6 py-2 rounded-full">Sign Up</a></div>
                 <div class="auth-profile-section hidden relative group">
                     <a href="/profile" class="flex items-center gap-4">
                        <div class="text-right hidden md:block"><div class="auth-user-name font-semibold text-white">User</div></div>
                        <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=Felix" class="auth-user-avatar w-10 h-10 rounded-full" />
                     </a>
                     <!-- Dropdown -->
                     <div class="absolute top-full right-0 pt-2 w-48 hidden group-hover:block z-50">
                        <div class="bg-surface border border-white/10 rounded-xl shadow-xl overflow-hidden">
                             <a href="/profile" class="block px-4 py-3 hover:bg-white/5">Profile</a>
                             <button class="auth-logout-btn w-full text-left px-4 py-3 text-red-500 hover:bg-white/5">Logout</button>
                        </div>
                     </div>
                 </div>
             </div>
          </div>
        </header>

        <div class="p-8 pb-32">
          <!-- Playlist View -->
          <div id="single-playlist-view">
            <!-- Hero -->
            <div class="flex flex-col md:flex-row items-center md:items-end gap-6 md:gap-8 mb-8 md:mb-12 text-center md:text-left">
              <div
                class="w-48 h-48 md:w-52 md:h-52 rounded-xl overflow-hidden shadow-2xl relative group mx-auto md:mx-0 bg-surface flex items-center justify-center"
              >
                <!-- Dynamic Image or Fallback -->
                <img
                  id="playlist-image"
                  src="assets/images/album/default_album.png"
                  class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500 hidden"
                />
                <svg id="playlist-placeholder-icon" class="w-16 h-16 text-white/10" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/></svg>
              </div>
              <div class="flex-1 space-y-2 w-full">
                <div
                  id="playlist-description"
                  class="text-sm font-medium text-white uppercase tracking-wider"
                >
                  Playlist
                </div>
                <h1
                  id="playlist-title"
                  class="text-3xl md:text-5xl lg:text-6xl font-bold text-white tracking-tight leading-tight"
                >
                  Loading...
                </h1>
                <div
                  id="hero-stats-row"
                  class="flex items-center justify-center md:justify-start gap-2 text-text-secondary text-sm"
                >
                  <!-- Populated by JS -->
                </div>

                <div class="flex items-center justify-center md:justify-start gap-4 pt-6">
                  <button
                    id="play-all-btn"
                    class="w-14 h-14 bg-primary text-white rounded-full flex items-center justify-center shadow-lg shadow-primary/25 hover:scale-105 active:scale-95 transition-all"
                  >
                    <svg class="w-6 h-6 ml-1 fill-current" viewBox="0 0 24 24">
                      <path d="M8 5v14l11-7z" />
                    </svg>
                  </button>
                 
                  <!-- Delete Button (Only visible if owner) -->
                  <button id="delete-playlist-btn" class="hidden text-red-500 hover:text-red-400 p-2 ml-4">
                     <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                  </button>
                </div>
              </div>
            </div>

            <!-- Tracklist Table -->
            <section class="mb-12">
              <div
                class="bg-surface/50 rounded-2xl overflow-hidden backdrop-blur-sm"
              >
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr
                      class="text-text-secondary text-xs uppercase border-b border-white/5"
                    >
                      <th class="px-4 py-3 font-medium w-12 text-center">#</th>
                      <th class="px-4 py-3 font-medium">Title</th>
                      <th class="px-4 py-3 font-medium text-right w-24">
                        <svg class="w-4 h-4 ml-auto" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                      </th>
                      <!-- Remove column -->
                      <th class="w-12"></th> 
                    </tr>
                  </thead>
                  <tbody id="playlist-tracks" class="text-sm text-gray-300">
                    <!-- Loaded via JS -->
                  </tbody>
                </table>
              </div>
            </section>
          </div>

          <!-- Main Footer -->
          <footer class="mt-20 border-t border-white/5 pt-12 hidden md:block">
            <div class="max-w-6xl mx-auto px-4 grid grid-cols-1 md:grid-cols-4 gap-8 mb-12">
               <div class="space-y-4">
                <h4 class="text-xl font-bold text-white flex items-center gap-2">Beatify</h4>
                <p class="text-sm text-text-secondary">High-fidelity streaming.</p>
               </div>
               <!-- Footer links ... -->
            </div>
            <div class="max-w-6xl mx-auto px-4 pt-8 border-t border-white/5 text-xs text-text-secondary">
               © 2025 Beatify.
            </div>
          </footer>
        </div>
      </main>
    </div>

    <!-- Modals, Player, etc. -->
    <div id="displayMessage" class="hidden">
      <div id="messageContent" class="message-content-base">
        <div class="msg-icon-box" id="msgIcon"></div>
        <span id="message">Notification</span>
      </div>
    </div>

    <div id="globalLoader">
      <div class="equalizer"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
      <div class="loader-text">Loading</div>
    </div>

    <script type="module" src="/assets/js/player.js"></script>
    <script type="module" src="/assets/js/pages/playlist.js"></script>
    <script type="module" src="/assets/js/main.js"></script>
  </body>
</html>
